<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Ballpark - Calculate &amp; track your net worth</title>
    <style>
      :root {
        --background-color: #fff;
        --background-color-highlight: #E4F1F0;
        --button-background-color: #fff;
        --text-color: #000;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background-color: #000;
          --background-color-highlight: #111;
          --button-background-color: #111;
          --text-color: #fff;
        }
      }

      * {
        margin: 0;
        padding: 0;
        font-size: 1rem;
        font-weight: 400;
        box-sizing: border-box;
      }
      html {
        padding: 1rem;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      body {
        display: flex;
        flex-direction: column;
        flex: 1;

        font-family: monaco, monospace;
        color: var(--text-color);
        background-color: var(--background-color);
        background-image: linear-gradient(var(--background-color), var(--background-color-highlight));
      }

      main {
        flex: 1;
        border: 0.5px solid var(--text-color);
        border-bottom-width: 1.5px;
        border-right-width: 1px;
        border-radius: 0.85rem;
        overflow: scroll;
      }
      #total_container {
        padding: 1.5rem;
      }
      #total_container > h1 {
        font-weight: 600;
        font-family: futura;
        margin-bottom: 0.25rem;
      }
      #total_container > h2 {
        font-size: 1.75rem;
      }

      .account {
        display: flex;
        gap: 1rem;
        border-top: 0.5px dashed var(--text-color);
        padding: 0.85rem 1.5rem;
      }
      .account h1 {
        font-weight: 600;
        font-size: 0.75rem;
        margin-bottom: 0.25rem;
      }
      .account .icon {
        width: 2.5rem;
        height: 2.5rem;
        background: var(--button-background-color);
        border: 0.5px solid var(--text-color);
        border-bottom-width: 1.5px;
        border-right-width: 1px;
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #modal_overlay {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: var(--background-color);
        opacity: 0.8;
      }

      #new_account_form {
        display: none;
      }
      #edit_account_form {
        display: none;
      }
      #settings {
        display: none;
      }

      .modal {
        background: var(--background-color);
        width: 400px;
        position: fixed;
        top: 50%;
        left: 50%;
        padding: 20px;
        transform: translateX(-50%) translateY(-50%);
        border: 0.5px solid var(--text-color);
        border-bottom-width: 1.5px;
        border-right-width: 1px;
        border-radius: 0.85rem;
      }

      #modal_overlay.shown {
        display: block;
      }
      #new_account_form.shown {
        display: block;
      }
      #edit_account_form.shown {
        display: block;
      }
      #settings.shown {
        display: block;
      }
      #undo, #redo {
        display: none;
      }
      #undo.shown, #redo.shown {
        display: block;
      }

      button {
        appearance: none;
        -webkit-appearance: none;
        border: 0.5px solid var(--text-color);
        border-bottom-width: 1.5px;
        border-right-width: 1px;
        border-radius: 0.35rem;
        background: var(--button-background-color);
        color: var(--text-color);
        font-family: inherit;
        font-size: 0.75rem;
        padding: 0.25rem 0.65rem;
      }

      .spacer {
        flex: 1;
      }

      #temp_action {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header id="total_container">
        <h1>BALLPARK</h1>
        <h2 id="total"></h2>
        <div id="temp_action">
          <button id="new_account">+ Account</button>
          <button id="settings_button">Settings</button>
          <div class="spacer"></div>
          <button id="undo">↩</button>
          <button id="redo">↪</button>
        </div>
      </header>
      <div id="accounts"></div>
      <div id="modal_overlay"></div>
      <form id="new_account_form" class="modal">
        <input type="text" name="name" placeholder="Name" />
        <select name="account_type">
          <option value="savings">Savings</option>
          <option value="investments">Investments</option>
          <option value="property">Property</option>
          <option value="student_loan">Student Loan</option>
          <option value="car_loan">Car Loan</option>
          <option value="mortgage">Mortgate</option>
        </select>
        <input type="number" name="initial_value" placeholder="Value" />

        <hr />
        <button type="submit">Create Account</button>
      </form>

      <div id="settings" class="modal">
        <h1>Settings</h1>

        <input type="file" id="import_data_file_picker" accept=".json" style="display: none;" />
        <button type="button" id="import_data">Import Data</button>
        <button type="button" id="export_data">Export Data</button>
        <button type="button" id="reset_data_button">Reset</button>
      </div>

      <form id="edit_account_form" class="modal">
        <div id="account_name">Account</div>

        <input type="number" name="account_value" placeholder="Value" />

        <button type="submit">Save</button>

        <button type="button" id="delete_account">Delete Account</button>
      </form>
    </main>
    <script>
      const $ = (q) => document.querySelector(q)
      const $$ = (q) => document.querySelectorAll(q)
      function newID () { return crypto.randomUUID() }

      let netWorthData = { accounts: [] }
      try {
        netWorthData = JSON.parse(localStorage.getItem('netWorth')) 
      } catch(e) {
      }
      Object.freeze(netWorthData)

      let undos = []
      let redos = []
      function commit(newData, opts = {}) {
        if (!newData || newData === netWorthData) {
          // Need to enforce in order to support history
          throw 'nope'
        }
        if (opts.undoing) {
          redos.push(netWorthData)
        } else {
          undos.push(netWorthData)
        }
        // console.log("undos", undos)
        // console.log("redos", redos)

        localStorage.setItem("netWorth", JSON.stringify(newData))
        // console.log(JSON.stringify(newData, null, 2))
        netWorthData = newData
        Object.freeze(netWorthData)

        $('#undo').classList.toggle('shown', Boolean(undos.length))
        $('#redo').classList.toggle('shown', Boolean(redos.length))
      }
      const modalOverlay = $('#modal_overlay')
      const newAccountForm = $('#new_account_form')
      const editAccountForm = $('#edit_account_form')
      let activeModal = undefined;
      let activeAccount = undefined;

      $('#undo').addEventListener('click', () => {
        const snapshot = undos.pop()
        commit(snapshot, { undoing: true })

        renderEverything()
      })

      $('#redo').addEventListener('click', () => {
        const snapshot = redos.pop()
        commit(snapshot)

        renderEverything()
      })

      $('#new_account').addEventListener('click',  () => {
        modalOverlay.classList.add('shown')
        newAccountForm.classList.add('shown')
        activeModal = newAccountForm
      })

      $('#settings_button').addEventListener('click', () => {
        modalOverlay.classList.add('shown')
        const settingsModal = $('#settings')
        settingsModal.classList.add('shown')
        activeModal = settingsModal

      })

      $('#import_data').addEventListener('click', () => {
        $('#import_data_file_picker').click()
      })

      function validateImport(jsonString) {
        // TODO: implement me
        return JSON.parse(jsonString)
      }

      $('#import_data_file_picker').addEventListener('change', async (event) => {
        const selectedFile = $('#import_data_file_picker').files[0]
        if (!selectedFile) {
          alert('Something went wrong!!!!')
        }

        const reader = new FileReader()
        reader.onload = (e) => {
          const validatedImport = validateImport(e.target.result)
          if (validatedImport) {
            commit(validatedImport)
            renderEverything()
          }
        }
        reader.readAsText(selectedFile)
      })

      $('#export_data').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(netWorthData, null, 2)]);
        const link = document.createElement("a");
        link.download = 'download.json';
        link.href = window.URL.createObjectURL(blob);
        link.click()
      })

      $('#reset_data_button').addEventListener('click', () => {
        commit({ accounts: [] })
        renderEverything()
      })

      newAccountForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target
        const data = new FormData(form)
        const name = data.get("name") || "Account"
        const initialValue = parseInt(data.get("initial_value")) || 0
        const accountType = data.get("account_type")

        const snapshot = getNetWorthSnapshot()
        snapshot.accounts.push({ id: newID(), name, account_type: accountType, value: initialValue, history: [] })
        commit(snapshot)
        closeActiveModal()
        renderEverything()
        form.reset()
      })

      function closeActiveModal() {
        activeModal.classList.remove('shown')
        modalOverlay.classList.remove('shown')
      }

      modalOverlay.addEventListener('click', () => {
        closeActiveModal()
      })

      function isLiability (account) {
        return ['car_loan', 'student_loan', 'mortgage'].includes(account.account_type)
      }

      function accountEmoji(account) {
        switch (account.account_type) {
          case "savings": return '💰'
          case "investments": return '📈'
          case "property": return '🏠'
          case "student_loan": return '🎓'
          case "car_loan": return '🚗'
          case "mortgage": return '🏠'
          default: return '🏛️'
        }
      }

      function accountValue(account) {
        const factor = isLiability(account) && account.value > 0 ? -1 : +1
        return (account.value * factor)
      }

      function renderTotal() {
        const total = netWorthData.accounts.reduce((total, account) => {
          return total + accountValue(account) 
        }, 0)
        const totalDisplay = $('#total')
        totalDisplay.textContent = money(total ?? 0)
      }

      function renderEverything() {
        renderTotal()
        renderAccounts()
      }

      const formatter = new Intl.NumberFormat("en-US", { 
        style: "currency", 
        currency: "USD", 
        maximumSignificantDigits: 4, 
        notation: "compact", 
      })

      function money(int) {
        return formatter.format(int)
      }

      function renderAccounts() {
        const accountsUI = netWorthData.accounts.reduce((ui, account) => {
          const accountUI = `
            <div class="account" data-id="${account.id}">
              <div class="icon" draggable="true">${accountEmoji(account)}</div>
              <header>
                <h1>${account.name}</h1>
                <h2>${money(accountValue(account))}</h2>
              </header>
            </div>
            `
          return ui + accountUI
        }, "")

        $('#accounts').innerHTML = accountsUI
      }

      document.addEventListener('click', (event) => {
        const accountElement = event.target.closest('.account')
        if (accountElement) {
          const accountId = accountElement.dataset.id
          const account = netWorthData.accounts.find(a => a.id === accountId)
          if (account) {
            activeAccount = account
            modalOverlay.classList.add('shown')

            editAccountForm.classList.add('shown')
            activeModal = editAccountForm
            renderEditAccountForm()
          }
        }
      })

      function renderEditAccountForm() {
        $('#account_name').textContent = activeAccount.name
        $('#edit_account_form input[name="account_value"]').value = activeAccount.value
        $('#delete_account').addEventListener('click', () => {
          const snapshot = getNetWorthSnapshot()
          snapshot.accounts = snapshot.accounts.filter(a => a.id !== activeAccount.id)
          commit(snapshot)
          closeActiveModal()
          renderEverything()
        })
      }

      function getNetWorthSnapshot() {
        return JSON.parse(JSON.stringify(netWorthData))
      }

      editAccountForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!activeAccount) {
          return
        }
        const form = e.target
        const data = new FormData(form)
        const newValue = parseInt(data.get("account_value")) || 0

        if (activeAccount.value === newValue) {
          return
        }

        const snapshot = getNetWorthSnapshot()
        const snapshotAccount = snapshot.accounts.find(a => a.id === activeAccount.id)
        snapshotAccount.value = newValue
        commit(snapshot)

        closeActiveModal()
        renderEverything()
        form.reset()
      })

      function initialize() {
        renderEverything()
        console.log(JSON.stringify(netWorthData, null, 2))
      }
      initialize()

    </script>
  </body>
</html>
